<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/signupform-style.css">
    <script src="scripts/script.js" defer></script>
    <title>Sign Up Form</title>
</head>

<body>
    <aside>
        <div class="banner-wrapper">
            <h1>Welcome to Our Community!</h1>
        </div>
        <img id="side-img" src="./imgs/Firefly-ByRafa.jpeg" alt="Sign Up Image">
    </aside>
    <section>
        <h1>This is totally not a placeholder text that is written to test the layout of the form.</h1>
        <form id="signup" class="signup-form" action="#" method="post">
            <h2>Let's do this!</h2>

            <div class="fieldset-container">
                <fieldset>
                    <legend>Personal Information</legend>
                    <div>
                        <label for="firstname">First Name:</label>
                        <input type="text" id="firstname" name="firstname" required>
                    </div>

                    <div>
                        <label for="lastname">Last Name:</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                </fieldset>
            </div>

            <fieldset>
                <legend>Contact Information</legend>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Security</legend>
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div>
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>

            </fieldset>
            </div>
        </form>

        <div class="submit-btn-wrapper">
            <button type="submit" form="signup">Sign Up</button>
            <h3>
                Already have an account?
                <a href="#">Log in</a>
            </h3>
        </div>

    </section>
</body>

</html>
